<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>POS Mayorista</title>
<script>
(function(){const p=new URLSearchParams(location.search);if(p.get("desktop")==="1"){location.replace("./desktop.html"+location.search+location.hash);return}if(p.get("mobile")==="1"){location.replace("./mobile.html"+location.search+location.hash);return}const s=matchMedia("(max-width: 820px)").matches;const t=navigator.maxTouchPoints&&navigator.maxTouchPoints>0;const m=/Android|iPhone|iPod|Mobile/i.test(navigator.userAgent);location.replace((m||(s&&t)?"./mobile.html":"./desktop.html")+location.search+location.hash)})();
</script></head><body>Cargando POS Mayorista...</body></html>
