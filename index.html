<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>POS Mayorista</title>
  <script>
    (function(){
      const params = new URLSearchParams(window.location.search);
      if (params.get("desktop") === "1") { window.location.replace("./desktop.html" + window.location.search + window.location.hash); return; }
      if (params.get("mobile") === "1") { window.location.replace("./mobile.html" + window.location.search + window.location.hash); return; }
      const isSmallScreen = window.matchMedia("(max-width: 820px)").matches;
      const isTouch = navigator.maxTouchPoints && navigator.maxTouchPoints > 0;
      const isMobileUA = /Android|iPhone|iPod|Mobile/i.test(navigator.userAgent);
      window.location.replace((isMobileUA || (isSmallScreen && isTouch) ? "./mobile.html" : "./desktop.html") + window.location.search + window.location.hash);
    })();
  </script>
</head>
<body>Cargando POS Mayorista...</body>
</html>
