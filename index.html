<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>POS Mayorista</title>
  <script>
    (function(){
      const params = new URLSearchParams(window.location.search);

      if (params.get("desktop") === "1") {
        window.location.replace("./desktop.html" + window.location.search + window.location.hash);
        return;
      }

      if (params.get("mobile") === "1") {
        window.location.replace("./mobile.html" + window.location.search + window.location.hash);
        return;
      }

      const isSmallScreen = window.matchMedia("(max-width: 820px)").matches;
      const isTouch = navigator.maxTouchPoints && navigator.maxTouchPoints > 0;
      const isMobileUA = /Android|iPhone|iPod|Mobile/i.test(navigator.userAgent);

      if (isMobileUA || (isSmallScreen && isTouch)) {
        window.location.replace("./mobile.html" + window.location.search + window.location.hash);
      } else {
        window.location.replace("./desktop.html" + window.location.search + window.location.hash);
      }
    })();
  </script>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Arial,sans-serif;background:#f6f7fb;color:#111827}
    .box{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:24px;box-shadow:0 10px 28px rgba(17,24,39,.08);text-align:center}
  </style>
</head>
<body>
  <div class="box">
    <h2>Cargando POS Mayorista...</h2>
    <p>Detectando dispositivo.</p>
    <p><a href="./desktop.html?desktop=1">Abrir versión computadora</a></p>
    <p><a href="./mobile.html?mobile=1">Abrir versión celular</a></p>
  </div>
</body>
</html>
